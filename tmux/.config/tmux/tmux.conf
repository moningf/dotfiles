##### 基础 #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 200000
setw -g mode-keys vi
set -g escape-time 0
#
##### Pane 操作 #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 分屏
bind '-' split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind x kill-pane

# 调整pane大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 最大化/恢复pane
bind m resize-pane -Z

# 切换布局
bind Space next-layout

# 交换pane位置
# bind -r { swap-pane -U
# bind -r } swap-pane -D

##### Window 操作 #####
# Vim风格窗口切换
bind -r n next-window
bind -r p previous-window
bind w choose-window
bind t new-window
bind c new-window -c "#{pane_current_path}"
bind & kill-window

##### Session 操作 #####
bind s choose-session
bind -r ( switch-client -p
bind -r ) switch-client -n
bind $ command-prompt -I "#S" "rename-session '%%'"

##### Copy-mode (Vim风格) #####
# 进入copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
# 搜索
bind -T copy-mode-vi / command-prompt -p "(search down)" "send -X search-forward "%%""
bind -T copy-mode-vi ? command-prompt -p "(search up)" "send -X search-backward "%%""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
# 翻页
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-b send -X page-up
bind -T copy-mode-vi C-f send -X page-down

##### 滚轮自动 copy-mode #####
bind -n WheelUpPane if -F "#{pane_in_mode}" \
  "send-keys -M" \
  "copy-mode -e; send-keys -M"
bind -n WheelDownPane send-keys -M

#### 配置Opencode的滚轮
# 定义检测逻辑：检查当前命令是否匹配 "opencode" 
# (如果你的程序显示的命令是 python，请把下面的 "opencode" 改为 "python")
bind -n WheelUpPane if-shell -F -t = "#{==:#{pane_current_command},opencode}" \
    "send-keys PgUp" \
    "if-shell -F -t = '#{alternate_on}' \
        'send-keys -M' \
        'select-pane -t =; copy-mode -e; send-keys -M'"

bind -n WheelDownPane if-shell -F -t = "#{==:#{pane_current_command},opencode}" \
    "send-keys PgDn" \
    "if-shell -F -t = '#{alternate_on}' \
        'send-keys -M' \
        'select-pane -t =; send-keys -M'"

##### TPM #####
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Theme
set -g @plugin 'dracula/tmux'
# 自动恢复
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Dracula主题设置
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon "#S"
set -g @dracula-show-timezone false
set -g @dracula-military-time true
set -g @dracula-time-format "%Y-%m-%d %H:%M"

# 自动恢复设置
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "opencode->opencode -c"'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# 初始化插件管理器TPM (必须放在最后一行)
run '~/.tmux/plugins/tpm/tpm'
